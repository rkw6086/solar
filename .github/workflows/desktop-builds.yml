name: Build Windows and Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      beta-id:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: solar-desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '3'
  CARGO_INCREMENTAL: '0'
  SOLAR_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  SOLAR_RELEASE_SHA: ${{ inputs.source-sha || github.sha }}
  SOLAR_RELEASE_VERSION: ${{ inputs.version }}
  SOLAR_BUILD_CHANNEL: ${{ inputs.channel || 'ci' }}
  SOLAR_BETA_ID: ${{ inputs.beta-id }}
  SOLAR_SOURCE_COMMIT: ${{ inputs.source-sha || github.sha }}
  SOLAR_SOURCE_MODIFIED: 'false'
  VITE_SOLAR_BUILD_CHANNEL: ${{ inputs.channel || 'ci' }}
  VITE_SOLAR_SOURCE_COMMIT: ${{ inputs.source-sha || github.sha }}

jobs:
  build:
    name: ${{ matrix.label }} x64
    if: github.repository == 'rkw6086/solar'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-2025
          - label: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Validate source and platform
        id: prepare
        run: node scripts/ci/desktop-build.mjs prepare
      - name: Restore unsigned build caches
        id: build_cache
        uses: ./.github/actions/build-cache
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 bubblewrap
      - name: Install pinned Rust and package manager
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target '${{ steps.prepare.outputs.target }}'
          npm install --global corepack@0.36.0
          corepack pnpm install --frozen-lockfile
      - name: Build unsigned desktop packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/ci/desktop-build.mjs build
      - name: Flush compiler cache
        id: finish_cache
        continue-on-error: true
        run: node scripts/ci/cache-paths.mjs finish
      - name: Retain unsigned caches from main
        if: >-
          ${{ success() && steps.finish_cache.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true' &&
              github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build_cache.outputs.paths }}
          key: ${{ steps.build_cache.outputs.key }}
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solar-${{ steps.prepare.outputs.platform }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
