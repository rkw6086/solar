[workspace]
members = ["crates/solar-agent-core", "crates/solar-providers", "crates/solar-tools", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
