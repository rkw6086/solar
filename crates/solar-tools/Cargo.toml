[package]
name = "solar-tools"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
build = "build.rs"

[dependencies]
base64 = "0.22"
cap-std = "4.0.3"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt", "macros"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
