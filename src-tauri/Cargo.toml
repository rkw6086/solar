[package]
name = "solar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "solar"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "solar"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
solar-agent-core = { path = "../crates/solar-agent-core" }
solar-providers = { path = "../crates/solar-providers" }
solar-tools = { path = "../crates/solar-tools" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication", "NSScreen", "NSResponder", "NSView", "NSSound"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"
