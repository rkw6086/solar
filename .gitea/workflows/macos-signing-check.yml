name: macOS signing check

on:
  workflow_dispatch:

jobs:
  signing:
    runs-on: macos-arm64
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Check out signing diagnostics
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check isolated signing and certificate lookup
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/ci/check-macos-signing.sh
