name: macOS release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  macos:
    # Register this runner label as macos-arm64:host. Do not run signing in Docker.
    runs-on: macos-arm64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.after != '0000000000000000000000000000000000000000'
    timeout-minutes: 240
    permissions:
      code: read
      actions: read
      releases: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SOLAR_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GITEA_SERVER_URL: ${{ github.server_url }}
      GITEA_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out trusted release source
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.17.0'

      - name: Validate a new version tag
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node scripts/ci/check-release-tag.mjs

      - name: Set up pinned build tools
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v rustup >/dev/null || { echo 'Install rustup for the runner user first.' >&2; exit 1; }
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target aarch64-apple-darwin
          npm install --global corepack@0.36.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo 'RUSTUP_TOOLCHAIN=1.99.1' >> "$GITHUB_ENV"
          [[ "$RUNNER_TEMP" == /* && "$SOLAR_JOB_ID" =~ ^[0-9]+-[0-9]*$ ]]
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/solar-build-$SOLAR_JOB_ID" >> "$GITHUB_ENV"
          echo "SOLAR_RELEASE_DIR=$RUNNER_TEMP/solar-artifacts-$SOLAR_JOB_ID" >> "$GITHUB_ENV"

      - name: Build and check Solar without signing credentials
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          bash scripts/ci/build-macos.sh

      - name: Sign, notarize, staple, and create DMG
        if: steps.release.outputs.release == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/ci/package-macos.sh

      - name: Upload verified DMG and checksums
        if: steps.release.outputs.release == 'true'
        # Gitea's v4-compatible artifact action; upstream upload-artifact rejects GHES.
        uses: https://gitea.com/actions/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: Solar-${{ steps.release.outputs.version }}-macos-arm64
          path: ${{ env.SOLAR_RELEASE_DIR }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove job build files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Signing keys are cleaned by package-macos.sh's EXIT/signal trap.
          # These are exact job-owned paths, never the runner's global caches.
          if [[ -n "${CARGO_TARGET_DIR:-}" && -n "${SOLAR_RELEASE_DIR:-}" ]]; then
            [[ "$CARGO_TARGET_DIR" == "${RUNNER_TEMP}/solar-build-"* ]]
            [[ "$SOLAR_RELEASE_DIR" == "${RUNNER_TEMP}/solar-artifacts-"* ]]
            rm -rf -- "$CARGO_TARGET_DIR" "$SOLAR_RELEASE_DIR"
          fi

  publish:
    needs: macos
    if: needs.macos.result == 'success' && needs.macos.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      code: read
      actions: read
      releases: write
    env:
      GITEA_SERVER_URL: ${{ github.server_url }}
      GITEA_REPOSITORY: ${{ github.repository }}
      SOLAR_RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_TAG: ${{ needs.macos.outputs.version }}
      SOLAR_RELEASE_SHA: ${{ needs.macos.outputs.sha }}
    steps:
      - name: Check out release publisher
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified release files
        # Patched v4 artifact protocol for Gitea; pinned to reviewed source.
        uses: https://github.com/christopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4
        with:
          name: Solar-${{ needs.macos.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/solar-release
      - name: Publish signed release to Gitea
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          export SOLAR_RELEASE_DIR="$RUNNER_TEMP/solar-release"
          python3 scripts/ci/publish-release.py
