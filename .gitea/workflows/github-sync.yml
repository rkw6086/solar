name: Sync GitHub

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    # Keep credentials and execution on Gitea. Polling also discovers branches
    # created on either service without running workflows from those branches.
    if: github.server_url == 'https://git.ryserve.net' && github.repository == 'internal/solar-chat' && github.ref == 'refs/heads/main' && vars.SOLAR_GITHUB_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      code: write
    steps:
      - name: Check out trusted sync implementation
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
          filter: blob:none

      - name: Verify Git and Git LFS are available
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git lfs version

      - name: Reconcile all branches and publish release tags
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SOLAR_GITHUB_SYNC_KEY: ${{ secrets.SOLAR_GITHUB_SYNC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SOLAR_GITHUB_SYNC_KEY:-}" ]]; then
            echo 'Add the Solar GitHub write deploy key as the Gitea SOLAR_GITHUB_SYNC_KEY Actions secret.' >&2
            exit 1
          fi
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$SOLAR_GITHUB_SYNC_KEY" > "$key_dir/id_ed25519"
          unset SOLAR_GITHUB_SYNC_KEY
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $key_dir/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/scripts/ci/github-known-hosts"
          python3 scripts/ci/sync-repositories.py --peer github
