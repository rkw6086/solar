name: Release checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      code: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.17.0'
      - name: Validate versions and release protections
        run: |
          node scripts/release.mjs check
          node --test scripts/release.test.mjs
          node --check scripts/ci/check-beta-build.mjs
          node --test scripts/beta.test.mjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
